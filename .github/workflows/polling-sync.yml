name: Polling sync

on:
  schedule:
    # Every 6 hours — polls drop throughout the day
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: polling-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The import-fiftyplusone-polling Supabase edge function pulls
      # FiftyPlusOne's CSV API (governor_general) and refreshes race_polls +
      # the race_polling aggregate using the project's own service role — no
      # secrets needed here. It fails loudly (non-2xx) if the fetch or upsert
      # breaks.
      - name: Trigger FiftyPlusOne import
        run: |
          RESP=$(curl -fsS -X POST \
            "https://lohxdfrxnxuxjdvvyfjc.supabase.co/functions/v1/import-fiftyplusone-polling" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$RESP"
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') else 1)"
